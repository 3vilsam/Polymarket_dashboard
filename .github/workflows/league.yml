# PAPER league. One public Hyperliquid /info tick. No secrets, no exchange writes.
name: paper league

on:
  schedule:
    # Every 5 minutes, but not at minute 0. GitHub drops or delays schedules that
    # hit the top of the hour, and on this public repo the Pages cron with the same
    # */5 pattern has been landing hours apart. The engine records a gap when a tick
    # is more than two intervals behind the previous one.
    - cron: '7-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: league
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numeric dependencies
        run: pip install -r paper-league/requirements.txt
      - name: One paper tick
        run: python paper-league/run_tick.py
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper-league/state
          if git diff --cached --quiet; then
            echo "tick produced no state change"
            exit 1
          fi
          tick=$(python -c 'import json; print(json.load(open("paper-league/state/last_tick.json"))["tick"])')
          git commit -m "paper-league: tick ${tick}"
          git push
