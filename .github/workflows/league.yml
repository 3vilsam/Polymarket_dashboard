# PAPER league. Public Hyperliquid /info only. No secrets and no exchange writes.
# GitHub's cron on this public repo lands hours apart, so each run queues the next
# one. actions: write is only for that workflow_dispatch. GITHUB_TOKEN is allowed
# to create workflow_dispatch runs; it does not create runs for other events.
name: paper league

on:
  schedule:
    # Backup if the self-dispatch chain is cancelled. Not the 5-minute clock.
    - cron: '7-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: league
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Mark start
        run: date +%s > "$RUNNER_TEMP/start_epoch"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: paper-league/requirements.txt
      - name: Install frozen numeric dependencies
        run: pip install -r paper-league/requirements.txt
      - name: One paper tick
        id: tick
        run: python paper-league/run_tick.py
      - name: Commit state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper-league/state
          if git diff --cached --quiet; then
            echo "tick produced no state change"
            exit 1
          fi
          tick=$(python -c 'import json; print(json.load(open("paper-league/state/last_tick.json"))["tick"])')
          git commit -m "paper-league: tick ${tick}"
          git push
      - name: Pace about five minutes
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        run: |
          start=$(cat "$RUNNER_TEMP/start_epoch")
          now=$(date +%s)
          wait=$((300 - (now - start)))
          if [ "$wait" -gt 0 ]; then
            echo "sleep ${wait}s so the next tick is about 5 minutes after this run started"
            sleep "$wait"
          else
            echo "run already longer than 5 minutes (${now - start}s); queue the next tick now"
          fi
      - name: Queue the next tick
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run league.yml --ref main
