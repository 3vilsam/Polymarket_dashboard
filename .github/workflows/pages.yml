# Deploy the static site to GitHub Pages.
# A Node step writes data/live.json into the artifact only. That file is not committed.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Every 5 minutes. GitHub may start this later than the clock time.
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time. A run already waiting is replaced by a newer one;
# the run that is in progress is left to finish so deploys do not overlap.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build same-origin market mirror
        timeout-minutes: 2
        run: node scripts/build-live.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
